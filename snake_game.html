<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }

        .game-container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin: 0 0 10px 0;
        }

        .score {
            font-size: 20px;
            color: #666;
            margin-bottom: 20px;
        }

        canvas {
            border: 3px solid #333;
            border-radius: 5px;
            background: #f0f0f0;
            display: block;
            margin: 0 auto;
        }

        .controls {
            margin-top: 20px;
            color: #666;
        }

        .game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
        }

        .game-over h2 {
            margin: 0 0 20px 0;
            font-size: 36px;
        }

        .restart-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .restart-btn:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 贪吃蛇游戏</h1>
        <div class="score">得分: <span id="score">0</span> | 最高分: <span id="highScore">0</span></div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            <p>使用方向键 ⬆️ ⬇️ ⬅️ ➡️ 控制蛇的移动</p>
            <p>按空格键暂停/继续</p>
        </div>
    </div>

    <div class="game-over" id="gameOver">
        <h2>游戏结束!</h2>
        <p>最终得分: <span id="finalScore">0</span></p>
        <button class="restart-btn" onclick="restartGame()">重新开始</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const gameOverElement = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 15, y: 15 };
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameLoop;
        let isPaused = false;
        let gameStarted = false;

        highScoreElement.textContent = highScore;

        function drawGame() {
            if (isPaused) return;

            // 移动蛇
            if (gameStarted) {
                const head = { x: snake[0].x + dx, y: snake[0].y + dy };

                // 检查墙壁碰撞
                if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                    gameOver();
                    return;
                }

                // 检查自身碰撞
                for (let segment of snake) {
                    if (head.x === segment.x && head.y === segment.y) {
                        gameOver();
                        return;
                    }
                }

                snake.unshift(head);

                // 检查是否吃到食物
                if (head.x === food.x && head.y === food.y) {
                    score++;
                    scoreElement.textContent = score;
                    if (score > highScore) {
                        highScore = score;
                        highScoreElement.textContent = highScore;
                        localStorage.setItem('snakeHighScore', highScore);
                    }
                    generateFood();
                } else {
                    snake.pop();
                }
            }

            // 清空画布
            ctx.fillStyle = '#f0f0f0';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 画网格
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 1;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // 画蛇
            snake.forEach((segment, index) => {
                ctx.fillStyle = index === 0 ? '#4CAF50' : '#66BB6A';
                ctx.fillRect(
                    segment.x * gridSize + 1,
                    segment.y * gridSize + 1,
                    gridSize - 2,
                    gridSize - 2
                );

                // 画蛇头的眼睛
                if (index === 0) {
                    ctx.fillStyle = 'white';
                    if (dx !== 0 || dy !== 0) {
                        const eyeSize = 3;
                        const eyeOffset = 6;
                        if (dx === 1) { // 向右
                            ctx.fillRect(segment.x * gridSize + eyeOffset + 5, segment.y * gridSize + 5, eyeSize, eyeSize);
                            ctx.fillRect(segment.x * gridSize + eyeOffset + 5, segment.y * gridSize + 12, eyeSize, eyeSize);
                        } else if (dx === -1) { // 向左
                            ctx.fillRect(segment.x * gridSize + eyeOffset - 2, segment.y * gridSize + 5, eyeSize, eyeSize);
                            ctx.fillRect(segment.x * gridSize + eyeOffset - 2, segment.y * gridSize + 12, eyeSize, eyeSize);
                        } else if (dy === 1) { // 向下
                            ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + eyeOffset + 5, eyeSize, eyeSize);
                            ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + eyeOffset + 5, eyeSize, eyeSize);
                        } else if (dy === -1) { // 向上
                            ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + eyeOffset - 2, eyeSize, eyeSize);
                            ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + eyeOffset - 2, eyeSize, eyeSize);
                        }
                    }
                }
            });

            // 画食物
            ctx.fillStyle = '#FF5252';
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                gridSize / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }

        function generateFood() {
            let newFood;
            do {
                newFood = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } while (snake.some(segment => segment.x === newFood.x && segment.y === newFood.y));
            food = newFood;
        }

        function gameOver() {
            clearInterval(gameLoop);
            finalScoreElement.textContent = score;
            gameOverElement.style.display = 'block';
        }

        function restartGame() {
            snake = [{ x: 10, y: 10 }];
            dx = 0;
            dy = 0;
            score = 0;
            isPaused = false;
            gameStarted = false;
            scoreElement.textContent = score;
            gameOverElement.style.display = 'none';
            generateFood();
            clearInterval(gameLoop);
            gameLoop = setInterval(drawGame, 100);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === ' ') {
                e.preventDefault();
                isPaused = !isPaused;
                return;
            }

            if (!gameStarted && (e.key.startsWith('Arrow') || ['w', 'a', 's', 'd'].includes(e.key))) {
                gameStarted = true;
            }

            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                    if (dy === 0) { dx = 0; dy = -1; }
                    break;
                case 'ArrowDown':
                case 's':
                    if (dy === 0) { dx = 0; dy = 1; }
                    break;
                case 'ArrowLeft':
                case 'a':
                    if (dx === 0) { dx = -1; dy = 0; }
                    break;
                case 'ArrowRight':
                case 'd':
                    if (dx === 0) { dx = 1; dy = 0; }
                    break;
            }
        });

        // 开始游戏
        gameLoop = setInterval(drawGame, 100);
        drawGame();
    </script>
</body>
</html>
